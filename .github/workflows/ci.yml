name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Test contract reader
        run: dotnet test TokidachiWin.Tests/TokidachiWin.Tests.csproj --configuration Release
      - name: Build MSIX-enabled WinUI app
        run: dotnet build TokidachiWin/TokidachiWin.csproj --configuration Release --arch x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false
      - name: Debug generated app manifest
        if: always()
        shell: pwsh
        run: |
          $obj = Join-Path $env:GITHUB_WORKSPACE 'TokidachiWin\obj'
          $manifests = Get-ChildItem -Path $obj -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '(?i)(appxmanifest|manifest)' }
          if ($null -eq $manifests -or $manifests.Count -eq 0) {
            Write-Host 'No generated appxmanifest found under obj.'
            exit 0
          }
          foreach ($manifest in $manifests) {
            Write-Host "--- Generated manifest: $($manifest.FullName) ---"
            Get-Content -Path $manifest.FullName | Select-Object -First 30
          }
      - name: Prepare self-signed MSIX smoke certificate
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Gaalbu' -CertStoreLocation 'Cert:\CurrentUser\My'
          $pfx = Join-Path $env:RUNNER_TEMP 'tokidachi-test-signing.pfx'
          $cer = Join-Path $env:RUNNER_TEMP 'tokidachi-test-signing.cer'
          $password = ConvertTo-SecureString 'tokidachi-ci-only' -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          "TOKIDACHI_TEST_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'Smoke certificate prepared'

      - name: Trust self-signed MSIX smoke certificate
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cer = Join-Path $env:RUNNER_TEMP 'tokidachi-test-signing.cer'
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Write-Host 'Smoke certificate trusted'

      - name: Sign MSIX for smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Include *.msix,*.msixbundle |
            Where-Object { $_.FullName -notmatch '\\Dependencies\\' } |
            Select-Object -First 1
          if ($null -eq $msix) { throw 'No MSIX package was produced by the build' }
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw 'signtool.exe was not found on the runner' }
          $pfx = Join-Path $env:RUNNER_TEMP 'tokidachi-test-signing.pfx'
          & $signtool.FullName sign /fd SHA256 /f $pfx /p tokidachi-ci-only $msix.FullName
          if ($LASTEXITCODE -ne 0) { throw 'MSIX signing failed' }
          "TOKIDACHI_TEST_MSIX=$($msix.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "MSIX signed: $($msix.FullName)"

      - name: Smoke test MSIX installation and launch
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = $null
          try {
            $unlockKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
            New-Item -Path $unlockKey -Force | Out-Null
            New-ItemProperty -Path $unlockKey -Name AllowAllTrustedApps -PropertyType DWord -Value 1 -Force | Out-Null
            Write-Host "Installing MSIX: $env:TOKIDACHI_TEST_MSIX"
            Add-AppxPackage -Path $env:TOKIDACHI_TEST_MSIX
            Write-Host 'MSIX installation completed'
            $package = Get-AppxPackage -Name 'Gaalbu.TokidachiWin'
            if ($null -eq $package) { throw 'MSIX package was not installed' }
            $exe = Join-Path $package.InstallLocation 'TokidachiWin.exe'
            Write-Host "Launching app: $exe"
            $started = Start-Process -FilePath $exe -PassThru
            Write-Host "Launch returned process id $($started.Id)"
            Start-Sleep -Seconds 5
            $process = Get-Process -Name 'TokidachiWin' -ErrorAction SilentlyContinue
            if ($null -eq $process) { throw 'TokidachiWin did not start' }
            Write-Host 'TokidachiWin started successfully'
            Stop-Process -Id $process.Id -Force
            Write-Host 'TokidachiWin stopped successfully'
          }
          finally {
            if ($null -ne $package) { Write-Host 'Removing MSIX package'; Remove-AppxPackage -Package $package.PackageFullName -ErrorAction SilentlyContinue; Write-Host 'MSIX removal completed' }
          }

      - name: Clean up MSIX smoke certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:TOKIDACHI_TEST_CERT_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:TOKIDACHI_TEST_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\Root\$env:TOKIDACHI_TEST_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
