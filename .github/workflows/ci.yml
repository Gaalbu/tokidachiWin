name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Test contract reader
        run: dotnet test TokidachiWin.Tests/TokidachiWin.Tests.csproj --configuration Release
      - name: Build MSIX-enabled WinUI app
        run: dotnet build TokidachiWin/TokidachiWin.csproj --configuration Release --arch x64
